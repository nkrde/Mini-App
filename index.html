<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeGlow Studio – Auto Monthly Top Trades Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#00F076',
                        bgDark: '#0A0A0A',
                        cardDark: '#141414',
                        borderDark: '#262626'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        .canvas-container { max-width: 100%; max-height: 80vh; overflow: auto; background: #111; border-radius: 12px; padding: 20px; display: flex; justify-content: center; align-items: center; }
        #mainCanvas { box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8); max-width: 100%; height: auto; display: block; border-radius: 4px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .cat-btn.active, .size-btn.active { border-color: #00FF88 !important; background-color: rgba(0, 255, 136, 0.05) !important; }
        .cat-btn.active span:first-child { color: #00FF88 !important; }
        input[type=range] { -webkit-appearance: none; background: #262626; border-radius: 10px; height: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #00F076; cursor: pointer; border: 2px solid #0A0A0A; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col lg:flex-row">

    <aside class="w-full lg:w-[400px] bg-cardDark border-r border-borderDark p-6 flex flex-col gap-6 shrink-0 overflow-y-auto max-h-screen">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center shadow-lg shadow-primary/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tighter text-white leading-none uppercase">TRADEGLOW <span class="text-primary">STUDIO</span></h1>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-1">Monthly Top Trades Generator</p>
            </div>
        </div>

        <section>
            <h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-gray-500 mb-3 flex items-center gap-2">
                <span class="w-4 h-[1px] bg-gray-800"></span> 1. DATA INPUT
            </h2>
            <div id="dropZone" class="border-2 border-dashed border-borderDark rounded-2xl p-6 text-center hover:border-primary transition-all cursor-pointer bg-bgDark/40 group relative">
                <input type="file" id="fileInput" class="hidden" accept=".xlsx, .csv">
                <div class="relative z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto text-gray-600 mb-3 group-hover:text-primary transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p class="text-xs font-bold text-gray-400 group-hover:text-white uppercase">Drop Excel / CSV</p>
                </div>
            </div>
        </section>

        <section>
            <h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-gray-500 mb-3 flex items-center gap-2">
                <span class="w-4 h-[1px] bg-gray-800"></span> 2. CATEGORY
            </h2>
            <div class="grid grid-cols-2 gap-2" id="categoryGrid">
                <button class="cat-btn active p-3 rounded-xl border border-borderDark bg-bgDark text-left hover:border-primary transition-all group" data-category="Hero Zero">
                    <span class="block text-[10px] font-black text-gray-500 mb-1 tracking-tighter uppercase">Hero-Zero</span>
                    <span class="text-[11px] font-bold text-gray-300 leading-tight">Index Trades<br>0 Days</span>
                </button>
                <button class="cat-btn p-3 rounded-xl border border-borderDark bg-bgDark text-left hover:border-primary transition-all group" data-category="Intraday">
                    <span class="block text-[10px] font-black text-gray-500 mb-1 tracking-tighter uppercase">Intraday</span>
                    <span class="text-[11px] font-bold text-gray-300 leading-tight">Stock Trades<br>0 Days</span>
                </button>
                <button class="cat-btn p-3 rounded-xl border border-borderDark bg-bgDark text-left hover:border-primary transition-all group" data-category="BTST">
                    <span class="block text-[10px] font-black text-gray-500 mb-1 tracking-tighter uppercase">BTST</span>
                    <span class="text-[11px] font-bold text-gray-300 leading-tight">Next Day<br>1 Day</span>
                </button>
                <button class="cat-btn p-3 rounded-xl border border-borderDark bg-bgDark text-left hover:border-primary transition-all group" data-category="Remaining">
                    <span class="block text-[10px] font-black text-gray-500 mb-1 tracking-tighter uppercase">Remaining</span>
                    <span class="text-[11px] font-bold text-gray-300 leading-tight">Options/Top<br>Everything Else</span>
                </button>
            </div>
        </section>

        <section>
            <h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-gray-500 mb-3 flex items-center gap-2">
                <span class="w-4 h-[1px] bg-gray-800"></span> 3. DIMENSIONS
            </h2>
            <div class="grid grid-cols-2 gap-2" id="sizeGrid">
                <button class="size-btn active p-3 rounded-xl border border-borderDark bg-bgDark text-center hover:border-primary transition-all group" data-size="1080x1080">
                    <span class="block text-[10px] font-black text-gray-500 mb-1 uppercase text-[8px]">Square (1:1)</span>
                    <span class="text-[11px] font-bold text-white">1080 x 1080</span>
                </button>
                <button class="size-btn p-3 rounded-xl border border-borderDark bg-bgDark text-center hover:border-primary transition-all group" data-size="1080x1350">
                    <span class="block text-[10px] font-black text-gray-500 mb-1 uppercase text-[8px]">Portrait (4:5)</span>
                    <span class="text-[11px] font-bold text-white">1080 x 1350</span>
                </button>
                <button class="size-btn p-3 rounded-xl border border-borderDark bg-bgDark text-center hover:border-primary transition-all group" data-size="1200x628">
                    <span class="block text-[10px] font-black text-gray-500 mb-1 uppercase text-[8px]">FB/TW (1.91:1)</span>
                    <span class="text-[11px] font-bold text-white">1200 x 628</span>
                </button>
                <button class="size-btn p-3 rounded-xl border border-borderDark bg-bgDark text-center hover:border-primary transition-all group" data-size="1080x1920">
                    <span class="block text-[10px] font-black text-gray-500 mb-1 uppercase text-[8px]">Story (9:16)</span>
                    <span class="text-[11px] font-bold text-white">1080 x 1920</span>
                </button>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-[11px] font-black uppercase tracking-[0.2em] text-gray-500 mb-1 flex items-center gap-2 uppercase">
                <span class="w-4 h-[1px] bg-gray-800"></span> 4. CUSTOMIZATION
            </h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-[9px] font-black text-gray-600 uppercase mb-1">Title Line 1</label>
                    <input type="text" id="titleLine1" value="TOP TRADES" class="w-full bg-bgDark border border-borderDark rounded-lg px-3 py-2 text-xs font-bold text-white outline-none uppercase">
                </div>
                <div>
                    <label class="block text-[9px] font-black text-gray-600 uppercase mb-1">Month & Year</label>
                    <input type="text" id="titleLine2" value="MARCH 2026" class="w-full bg-bgDark border border-borderDark rounded-lg px-3 py-2 text-xs font-bold text-white outline-none uppercase">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="flex justify-between text-[8px] font-black text-gray-600 uppercase mb-1">X POS <span id="xPosVal" class="text-primary">50%</span></label>
                        <input type="range" id="xPosSlider" min="0" max="100" value="50" class="w-full accent-primary">
                    </div>
                    <div>
                        <label class="flex justify-between text-[8px] font-black text-gray-600 uppercase mb-1">Y POS <span id="yPosVal" class="text-primary">22%</span></label>
                        <input type="range" id="yPosSlider" min="0" max="100" value="22" class="w-full accent-primary">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="flex justify-between text-[8px] font-black text-gray-600 uppercase mb-1">SIZE L1 <span id="tSizeVal" class="text-primary">100%</span></label>
                        <input type="range" id="tSizeSlider" min="10" max="200" value="100" class="w-full accent-primary">
                    </div>
                    <div>
                        <label class="flex justify-between text-[8px] font-black text-gray-600 uppercase mb-1">SIZE L2 <span id="sSizeVal" class="text-primary">100%</span></label>
                        <input type="range" id="sSizeSlider" min="10" max="200" value="100" class="w-full accent-primary">
                    </div>
                </div>
            </div>
        </section>

        <div class="mt-auto pt-6 space-y-3 border-t border-borderDark">
            <button id="extractBtn" class="w-full bg-primary hover:bg-green-300 text-black font-black py-4 rounded-xl transition-all shadow-xl shadow-primary/10 flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
                Auto Extract Top 5
            </button>
            <button id="downloadBtn" class="w-full bg-white hover:bg-gray-200 text-black font-black py-4 rounded-xl transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
                Download PNG
            </button>
        </div>
    </aside>

    <main class="flex-1 p-6 lg:p-10 flex flex-col gap-8 bg-bgDark overflow-y-auto">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-6 border-b border-borderDark">
            <div>
                <h2 class="text-xs font-black text-gray-500 uppercase tracking-[0.3em]">Monthly Trade Summary</h2>
                <p class="text-[10px] text-gray-600 font-bold uppercase mt-1">Real-time Visual Engine</p>
            </div>
            <div id="statusToast" class="opacity-0 transition-opacity duration-300 px-6 py-3 bg-primary/10 border border-primary/30 text-primary rounded-xl text-xs font-black uppercase tracking-widest shadow-2xl shadow-primary/5">
                Data Synchronized
            </div>
        </div>

        <div class="flex flex-col xl:flex-row gap-10">
            <div class="flex-1 min-w-0">
                <div class="bg-cardDark rounded-3xl border border-borderDark overflow-hidden shadow-2xl">
                    <div class="p-5 border-b border-borderDark bg-bgDark/40 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                            <h3 class="font-black text-[10px] tracking-[0.2em] text-gray-400 uppercase">Live Editor</h3>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-[10px] text-gray-500 uppercase tracking-widest border-b border-borderDark/50">
                                    <th class="p-5 font-black">Trade Details</th>
                                    <th class="p-5 font-black text-right">Returns %</th>
                                    <th class="p-5 font-black text-right">Holding</th>
                                </tr>
                            </thead>
                            <tbody id="tradeTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="xl:w-[500px] 2xl:w-[600px] shrink-0">
                <div class="sticky top-6 flex flex-col gap-4">
                    <h3 class="font-black text-[10px] tracking-[0.2em] text-gray-500 uppercase px-2">Canvas Preview</h3>
                    <div class="canvas-container">
                        <canvas id="mainCanvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const proxy = "https://images.weserv.nl/?url=";
        const templates = {
            "1200x628": proxy + "leading-harlequin-jovhlmkwql.edgeone.app/OP-%201.91_1.png",
            "1080x1080": proxy + "leading-harlequin-jovhlmkwql.edgeone.app/OP-%201_1.png",
            "1080x1350": proxy + "leading-harlequin-jovhlmkwql.edgeone.app/OP%204_5.png",
            "1080x1920": proxy + "leading-harlequin-jovhlmkwql.edgeone.app/HZ-1,%209-16.png"
        };

        const canvasConfigs = {
            "1200x628": { width: 1200, height: 628, tableTop: 280, rowHeight: 55, colX: { name: 150, returns: 650, duration: 950 }, fontS: { table: 26 } },
            "1080x1080": { width: 1080, height: 1080, tableTop: 420, rowHeight: 95, colX: { name: 180, returns: 600, duration: 880 }, fontS: { table: 36 } },
            "1080x1350": { width: 1080, height: 1350, tableTop: 550, rowHeight: 120, colX: { name: 180, returns: 600, duration: 880 }, fontS: { table: 42 } },
            "1080x1920": { width: 1080, height: 1920, tableTop: 780, rowHeight: 170, colX: { name: 180, returns: 600, duration: 880 }, fontS: { table: 48 } }
        };

        let rawTradeData = [];
        let currentCategory = "Hero Zero";
        let currentSize = "1080x1080";

        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('tradeTableBody');
            for (let i = 0; i < 5; i++) {
                const tr = document.createElement('tr');
                tr.className = "border-b border-borderDark/30 hover:bg-white/[0.02] group";
                tr.innerHTML = `
                    <td class="p-4 w-1/2"><input type="text" class="w-full bg-transparent border-none outline-none text-[13px] font-bold text-white placeholder-gray-800" placeholder="BUY BANKNIFTY MAR 22000 CE"></td>
                    <td class="p-4 w-1/4 text-right"><input type="text" class="w-full bg-transparent border-none outline-none text-[14px] font-black text-primary placeholder-gray-800 text-right" placeholder="+0.00%"></td>
                    <td class="p-4 w-1/4 text-right"><input type="text" class="w-full bg-transparent border-none outline-none text-[11px] font-bold text-gray-500 placeholder-gray-800 text-right" placeholder="Intraday"></td>
                `;
                tableBody.appendChild(tr);
            }

            const updateUIValues = () => {
                document.getElementById('xPosVal').textContent = document.getElementById('xPosSlider').value + '%';
                document.getElementById('yPosVal').textContent = document.getElementById('yPosSlider').value + '%';
                document.getElementById('tSizeVal').textContent = document.getElementById('tSizeSlider').value + '%';
                document.getElementById('sSizeVal').textContent = document.getElementById('sSizeSlider').value + '%';
                renderCanvas();
            };

            ['xPosSlider', 'yPosSlider', 'tSizeSlider', 'sSizeSlider', 'titleLine1', 'titleLine2'].forEach(id => {
                document.getElementById(id).oninput = updateUIValues;
            });

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.getAttribute('data-category');
                    if (rawTradeData.length) extractTrades(); else renderCanvas();
                };
            });

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSize = btn.getAttribute('data-size');
                    renderCanvas();
                };
            });

            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            dropZone.onclick = () => fileInput.click();
            dropZone.ondrop = (e) => { e.preventDefault(); handleFileUpload(e.dataTransfer.files[0]); };
            dropZone.ondragover = (e) => e.preventDefault();
            fileInput.onchange = (e) => handleFileUpload(e.target.files[0]);

            function handleFileUpload(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    rawTradeData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    showToast(`LOADED ${rawTradeData.length} TRADES`);
                    extractTrades();
                };
                reader.readAsArrayBuffer(file);
            }

            function extractTrades() {
                if (!rawTradeData.length) return;
                const keys = Object.keys(rawTradeData[0]);
                const f = (ss) => keys.find(k => ss.some(s => k.toLowerCase().includes(s)));
                const tk = f(['trade', 'symbol', 'instrument', 'script']);
                const rk = f(['return', 'p&l', 'roi', 'profit']);
                const dk = f(['duration', 'hold', 'day', 'period']);

                const processed = rawTradeData.map(row => {
                    const name = String(row[tk] || "");
                    const ret = parseFloat(String(row[rk]).replace(/[+%]/g, '')) || 0;
                    const dur = parseInt(row[dk]) || 0;
                    const isIdx = /\b(nifty|banknifty|sensex)\b/i.test(name);

                    let cat = "Remaining";
                    if (dur === 0) cat = isIdx ? "Hero Zero" : "Intraday";
                    else if (dur === 1 && !isIdx) cat = "BTST";

                    return { name: cleanName(name), returns: ret, duration: dur, category: cat };
                });

                const filtered = processed.filter(t => t.category === currentCategory)
                    .sort((a, b) => b.returns - a.returns).slice(0, 5);

                const rows = document.querySelectorAll('#tradeTableBody tr');
                rows.forEach((tr, i) => {
                    const ins = tr.querySelectorAll('input');
                    if (filtered[i]) {
                        ins[0].value = filtered[i].name;
                        ins[1].value = (filtered[i].returns >= 0 ? '+' : '') + filtered[i].returns.toFixed(2) + '%';
                        ins[2].value = filtered[i].duration === 0 ? "Intraday" : (filtered[i].duration === 1 ? "BTST" : `${filtered[i].duration} Days`);
                    } else { ins.forEach(n => n.value = ""); }
                });
                renderCanvas();
            }

            function cleanName(n) {
                let s = n.toUpperCase().replace(/\s+/g, ' ');
                ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'].forEach(m => {
                    s = s.replace(new RegExp(`\\b\\d{1,2}(ST|ND|RD|TH)?\\s+${m}\\b`, 'g'), m);
                    s = s.replace(new RegExp(`\\b${m}\\s+\\d{1,2}(ST|ND|RD|TH)?\\b`, 'g'), m);
                });
                return s.trim();
            }

            function renderCanvas() {
                const canvas = document.getElementById('mainCanvas');
                const ctx = canvas.getContext('2d');
                const conf = canvasConfigs[currentSize];
                canvas.width = conf.width; canvas.height = conf.height;

                const img = new Image();
                // We use anonymous crossOrigin to allow toDataURL() if CORS is configured on the server.
                // If it fails, we catch it in img.onerror.
                img.crossOrigin = "anonymous";

                const imageUrl = templates[currentSize];
                img.src = imageUrl;

                img.onload = () => {
                    ctx.drawImage(img, 0, 0, conf.width, conf.height);

                    const xPct = parseInt(document.getElementById('xPosSlider').value) / 100;
                    const yPct = parseInt(document.getElementById('yPosSlider').value) / 100;
                    const l1Size = (conf.width * 0.08) * (parseInt(document.getElementById('tSizeSlider').value) / 100);
                    const l2Size = (conf.width * 0.06) * (parseInt(document.getElementById('sSizeSlider').value) / 100);

                    const cx = conf.width * xPct;
                    const cy = conf.height * yPct;

                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 15;
                    ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;

                    // Title 1
                    ctx.font = `900 ${l1Size}px Inter`; ctx.fillStyle = "#00F076";
                    ctx.fillText(document.getElementById('titleLine1').value.toUpperCase(), cx, cy - (l1Size * 0.4));

                    // Title 2
                    ctx.font = `700 ${l2Size}px Inter`; ctx.fillStyle = "white";
                    ctx.fillText(document.getElementById('titleLine2').value.toUpperCase(), cx, cy + (l2Size * 0.6));

                    // Reset Shadow for Table
                    ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

                    const trades = [];
                    document.querySelectorAll('#tradeTableBody tr').forEach(tr => {
                        const ins = tr.querySelectorAll('input');
                        if (ins[0].value) trades.push({ n: ins[0].value, r: ins[1].value, d: ins[2].value });
                    });

                    trades.slice(0, 5).forEach((t, i) => {
                        const y = conf.tableTop + (i * conf.rowHeight);
                        ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 5;

                        ctx.textAlign = "left"; ctx.fillStyle = "white"; ctx.font = `700 ${conf.fontS.table}px Inter`;
                        ctx.fillText(t.n, conf.colX.name, y);

                        ctx.textAlign = "center"; ctx.fillStyle = "#00F076"; ctx.font = `800 ${conf.fontS.table}px Sora`;
                        ctx.fillText(t.r, conf.colX.returns, y);

                        ctx.textAlign = "center"; ctx.fillStyle = "white"; ctx.font = `600 ${conf.fontS.table - 6}px Inter`;
                        ctx.fillText(t.d.toUpperCase(), conf.colX.duration, y);
                    });
                };
                img.onerror = () => showToast("IMAGE LOAD ERROR - CHECK CORS", true);
            }

            function showToast(m, err = false) {
                const t = document.getElementById('statusToast');
                t.textContent = m; t.classList.remove('opacity-0');
                if (err) { t.classList.add('text-red-500', 'border-red-500/30'); }
                setTimeout(() => t.classList.add('opacity-0'), 3000);
            }

            document.getElementById('extractBtn').onclick = extractTrades;
            document.getElementById('tradeTableBody').oninput = renderCanvas;
            document.getElementById('downloadBtn').onclick = () => {
                const link = document.createElement('a');
                link.download = `${currentCategory.replace(' ','')}_${document.getElementById('titleLine2').value.replace(' ','')}_${currentSize}.png`;
                link.href = document.getElementById('mainCanvas').toDataURL("image/png");
                link.click();
            };
            if (document.fonts) document.fonts.ready.then(renderCanvas); else setTimeout(renderCanvas, 1000);
        });
    </script>
</body>
</html>
